<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>ZindagiCare — Patient &amp; Doctor consultation</title>
    <link rel="stylesheet" href="https://source.zoom.us/3.12.0/css/bootstrap.css" />
    <link rel="stylesheet" href="https://source.zoom.us/3.12.0/css/react-select.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
      }
      #zmmtg-root {
        width: 100%;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        pointer-events: none;
        padding: 24px;
        box-sizing: border-box;
      }
      #loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(148, 163, 184, 0.35);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loading-title {
        font-size: 18px;
        font-weight: 600;
        color: #f8fafc;
        text-align: center;
        max-width: 90%;
      }
      #loading-subtitle {
        font-size: 14px;
        color: #94a3b8;
        text-align: center;
        max-width: 90%;
        line-height: 1.5;
      }
      /* Hide Zoom Workplace branding inside embedded client */
      .wr-brand,
      .wr-logo,
      .meeting-info-container .wr-brand,
      .meeting-info-container .wr-logo,
      [class*="workplace"],
      [class*="Workplace"],
      .zmicon-workplace,
      .footer-brand,
      .sdk-footer-brand {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="loading-spinner" aria-hidden="true"></div>
      <div id="loading-title">ZindagiCare — Patient &amp; Doctor consultation</div>
      <div id="loading-subtitle">Preparing your secure video room…</div>
    </div>
    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/3.12.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.12.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.12.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.12.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.12.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.12.0.min.js"></script>
    <script>
      (function () {
        var ZOOM_VERSION = "3.12.0";
        var DEFAULT_TITLE = "ZindagiCare — Patient & Doctor consultation";
        var JOIN_TIMEOUT_MS = 45000;
        var started = false;
        var joinTimeoutId = null;
        var brandingObserver = null;
        var uiCopy = {
          gettingReady: "Preparing your secure video room…",
          couldNotJoinTitle: "Could not join consultation",
          pleaseTryAgain: "Please try again.",
          errors: {
            generic: "Could not join the video room. Please try again.",
            timeout:
              "Video is taking too long to connect. Check your internet connection and try again.",
            sdkLoad:
              "Video could not load. Check your internet, turn off ad blockers, then try again.",
          },
        };

        function mergeUiCopy(next) {
          if (!next) return;
          if (next.gettingReady) uiCopy.gettingReady = next.gettingReady;
          if (next.couldNotJoinTitle) uiCopy.couldNotJoinTitle = next.couldNotJoinTitle;
          if (next.pleaseTryAgain) uiCopy.pleaseTryAgain = next.pleaseTryAgain;
          if (next.errors) {
            uiCopy.errors = Object.assign({}, uiCopy.errors, next.errors);
          }
        }

        function postToParent(type, extra) {
          try {
            window.parent.postMessage(
              Object.assign({ type: type }, extra || {}),
              window.location.origin,
            );
          } catch (e) {
            /* ignore */
          }
        }

        function hideLoading() {
          var el = document.getElementById("loading");
          if (el) el.style.display = "none";
        }

        function showLoading(title, subtitle) {
          var el = document.getElementById("loading");
          if (!el) return;
          el.style.display = "flex";
          document.getElementById("loading-title").textContent = title || DEFAULT_TITLE;
          document.getElementById("loading-subtitle").textContent =
            subtitle || uiCopy.gettingReady;
        }

        function showError(message, title) {
          if (joinTimeoutId) {
            clearTimeout(joinTimeoutId);
            joinTimeoutId = null;
          }
          showLoading(title || uiCopy.couldNotJoinTitle, message || uiCopy.pleaseTryAgain);
          var spinner = document.getElementById("loading-spinner");
          if (spinner) spinner.style.display = "none";
        }

        function clearJoinTimeout() {
          if (joinTimeoutId) {
            clearTimeout(joinTimeoutId);
            joinTimeoutId = null;
          }
        }

        function startJoinTimeout() {
          clearJoinTimeout();
          joinTimeoutId = setTimeout(function () {
            var message = uiCopy.errors.timeout;
            showError(message);
            postToParent("zindagi-zoom-error", {
              message: "Join timed out",
            });
          }, JOIN_TIMEOUT_MS);
        }

        function applyBranding() {
          var selectors = [
            ".wr-brand",
            ".wr-logo",
            "[class*='workplace']",
            "[class*='Workplace']",
            ".zmicon-workplace",
            ".footer-brand",
            ".sdk-footer-brand",
          ];
          selectors.forEach(function (sel) {
            document.querySelectorAll(sel).forEach(function (node) {
              node.style.display = "none";
            });
          });

          document.querySelectorAll("*").forEach(function (node) {
            if (node.children.length === 0 && node.textContent) {
              var text = node.textContent.trim();
              if (text === "Zoom Workplace" || text === "Zoom workspace") {
                node.textContent = DEFAULT_TITLE;
              }
            }
          });
        }

        function watchBranding() {
          applyBranding();
          if (brandingObserver) return;
          brandingObserver = new MutationObserver(function () {
            applyBranding();
          });
          brandingObserver.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }

        function formatZoomError(err) {
          if (!err) return uiCopy.errors.generic;
          if (typeof err === "string") return err;
          return err.reason || err.message || err.errorMessage || uiCopy.errors.generic;
        }

        function startZoomSession(payload) {
          hideLoading();
          startJoinTimeout();

          ZoomMtg.init({
            leaveUrl: payload.leaveUrl,
            patchJsMedia: true,
            disableInvite: true,
            disableZoomLogo: true,
            showMeetingHeader: true,
            meetingInfo: ["topic"],
            disableCORP: !window.crossOriginIsolated,
            success: function () {
              ZoomMtg.join({
                signature: payload.signature,
                sdkKey: payload.sdkKey,
                meetingNumber: payload.meetingNumber,
                userName: payload.userName,
                passWord: payload.passcode || "",
                success: function () {
                  clearJoinTimeout();
                  watchBranding();
                  postToParent("zindagi-zoom-joined");
                },
                error: function (err) {
                  var message = formatZoomError(err);
                  showError(message);
                  postToParent("zindagi-zoom-error", { message: message });
                },
              });
            },
            error: function (err) {
              var message = formatZoomError(err);
              showError(message);
              postToParent("zindagi-zoom-error", { message: message });
            },
          });
        }

        function loadZoomI18n(payload) {
          var loadResult = ZoomMtg.i18n.load("en-US");
          if (loadResult && typeof loadResult.then === "function") {
            loadResult
              .then(function () {
                startZoomSession(payload);
              })
              .catch(function (err) {
                var message = formatZoomError(err) || uiCopy.errors.sdkLoad;
                showError(message);
                postToParent("zindagi-zoom-error", { message: message });
              });
            return;
          }

          if (ZoomMtg.i18n.onLoad) {
            ZoomMtg.i18n.onLoad(function () {
              startZoomSession(payload);
            });
            return;
          }

          startZoomSession(payload);
        }

        function joinMeeting(payload) {
          if (started || !payload) return;
          started = true;

          mergeUiCopy(payload.uiCopy);

          var title = payload.meetingTitle || DEFAULT_TITLE;
          showLoading(title, uiCopy.gettingReady);
          document.title = title;

          if (typeof ZoomMtg === "undefined") {
            showError(uiCopy.errors.sdkLoad);
            postToParent("zindagi-zoom-error", { message: "Video SDK failed to load." });
            return;
          }

          ZoomMtg.setZoomJSLib("https://source.zoom.us/" + ZOOM_VERSION + "/lib", "/av");
          ZoomMtg.preLoadWasm();
          ZoomMtg.prepareWebSDK();
          loadZoomI18n(payload);
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          if (event.data && event.data.type === "zindagi-zoom-join") {
            joinMeeting(event.data.payload);
          }
        });

        postToParent("zindagi-zoom-ready");
      })();
    </script>
  </body>
</html>
